name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (build + test + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Build both flavours so a wails-only regression (build tag drift)
      # surfaces here and not on the desktop release path.
      - name: build (default)
        run: go build ./...
      - name: build (wails desktop_only)
        run: go build -tags "wails desktop_only" ./cmd/spk-mail
      - name: test -race
        run: go test -race -timeout 180s ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  frontend:
    name: frontend (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: build
        working-directory: frontend
        run: npm run build
      - name: vitest
        working-directory: frontend
        run: npm test
