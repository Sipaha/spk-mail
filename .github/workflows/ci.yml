name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (build + test + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Wails desktop build pulls in webkit2gtk-4.1 / gtk+-3.0 via cgo.
      - name: install wails system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # Build both flavours so a wails-only regression (build tag drift)
      # surfaces here and not on the desktop release path.
      - name: build (default)
        run: go build ./...
      - name: build (wails desktop_only)
        run: go build -tags "wails desktop_only" ./cmd/spk-mail
      - name: test -race
        run: go test -race -timeout 180s ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  frontend:
    name: frontend (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: build
        working-directory: frontend
        run: npm run build
      - name: vitest
        working-directory: frontend
        run: npm test

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/playwright/package-lock.json
      # Installs once here (with --with-deps so system libs land too); touch
      # the same marker file `make test-e2e` checks so it doesn't redo the
      # ~150MB chromium download on every CI run.
      - name: playwright browsers
        run: |
          cd tests/playwright && npm ci
          npx playwright install --with-deps chromium
          touch node_modules/.playwright-browsers
      - name: make test-e2e
        run: make test-e2e
