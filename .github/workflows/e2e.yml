name: e2e

# Path-gated: Playwright is heavy (200MB+ Chromium download cached, full
# build chain) so we skip it for branch noise that can't possibly affect
# the rendered UI — typo fixes in docs, .github tweaks, etc.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'internal/**'
      - 'tests/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'internal/**'
      - 'tests/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            tests/playwright/package-lock.json

      # Cache the playwright browser download. The cache key is keyed on
      # the playwright lockfile so a pinned-version bump invalidates it
      # automatically. ~/.cache/ms-playwright is the default install dir.
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('tests/playwright/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      - name: make test-e2e
        run: make test-e2e

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/playwright-report
          retention-days: 14
