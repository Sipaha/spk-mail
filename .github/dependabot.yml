version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    # Wails Go module and the @wailsio/runtime npm package must move in
    # lockstep — bumping one without the other breaks the bindings (see
    # CLAUDE.md / dismissed.md). The npm side already ignores @wailsio/runtime
    # below; mirror that here for the Go side so Dependabot can't push the
    # Go module ahead and re-introduce a drift.
    ignore:
      - dependency-name: "github.com/wailsapp/wails/v3"
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    # Wails Go module and the @wailsio/runtime npm package must move in
    # lockstep — the version in package.json has to match the Go module
    # tag. Ignore Dependabot bumps for the runtime so they don't drift
    # ahead of the Go side; the bump should be done atomically by hand
    # together with the Go module upgrade.
    ignore:
      - dependency-name: "@wailsio/runtime"
    groups:
      js-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tests/playwright
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - tests
    # No ignore rule on @playwright/test: the e2e harness is fully
    # standalone (separate package.json + lockfile, no Wails coupling),
    # so version bumps land here without a paired bump elsewhere. If you
    # later add a runtime dep that must lockstep with another tree, mirror
    # the wails-runtime pattern in the /frontend block above.
